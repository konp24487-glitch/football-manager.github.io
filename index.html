function submitBulkContractRenewal(){

  const current=Math.max(.01,Number(p.wage)||.01);
  const wage=Math.round(current*factor*100)/100;
  const demand=Math.max(current,p.ovr*p.ovr*.00003)*1.15;
  const ratio=wage/demand;
  let probability=ratio>=1.15?.96:ratio>=1?.82:ratio>=.9?.58:ratio>=.8?.3:.1;
  probability+=.10+((Number(p.morale)||60)-60)*.002;
  if(p.age>=35)probability-=.12;else if(p.age>=32)probability-=.06;

   n.status='renewed';n.result=`${p.name}が一括交渉で契約${years}年・週給${money(wage)}を承認しました（${n.bulkAttempts}回目）。`;

   else n.result=`${p.name}は今回の条件に合意しませんでした。残り${3-n.bulkAttempts}回の提示が可能です。`;
  }
 }
 S.news=S.news.slice(0,12);save();render();
 toast(`一括交渉：承認 ${accepted}人／不成立 ${final}人${missing?'／対象外 '+missing+'人':''}`);

 n.status='listed';n.result=`${club}から${money(fee)}のオファーが届きました。クラブ通知で承諾・拒否を選べます。`;
 p.transferRequestPending=false;
 save();render();toast(`${club}から${p.name}へのオファーが届きました`);
}

function inboxPage(){let items=S.inbox||[],pending=inboxPendingCount();return `<section class="panel"><div class="between"><div><div class="sub">CLUB COMMUNICATIONS</div><h2>📨 クラブ通知</h2></div><span class="tag ${pending?'bad':'good'}">未確認・未対応 ${pending}件</span></div><p class="muted">他クラブからの移籍オファー、選手の引退表明・退団希望、契約満了前の更新交渉をここで確認・対応できます。通知はセーブデータに保存されます。</p>${bulkContractPanel()}${items.length?items.map(n=>{let p=S.players.find(x=>x.id===n.playerId),name=p?displayPlayerName(p):n.playerName||'選手';let status=notificationStatusLabel(n);let actions='';let body='';if(n.type==='club_offer'){body=`<div><b>${name}</b> に対して <b>${displayClubName(n.club)}</b> から移籍オファーが届きました。</div><div class="small">提示移籍金：<b class="goldtxt">${money(n.fee)}</b> · 市場価値：${money(n.value||p?.value||0)}</div>${Number(n.contractPenalty)>0?`<div class="small">基本オファー ${money(n.baseFee??(n.fee-n.contractPenalty))} ＋ 契約残存違約金 <b class="goldtxt">${money(n.contractPenalty)}</b>（契約残り${n.contractYearsAtOffer??p?.contract??'—'}年）</div>`:''}`;if(n.status==='pending'){actions=`<div class="actions"><button class="primary" onclick="respondIncomingOffer('${n.id}','accept')">承諾</button><button onclick="respondIncomingOffer('${n.id}','reject')">拒否</button><button class="gold" onclick="respondIncomingOffer('${n.id}','negotiate')">条件交渉</button></div>`}}
else if(n.type==='departure'){body=`<div><b>${name}</b> が退団を希望しています。</div><div class="small">理由：${n.reason||'出場機会への不満'} · モラル ${p?`${p.morale}/100`:'—'}</div>`;if(n.status==='pending'){actions=`<div class="actions"><button class="gold" onclick="inviteDepartureOffers('${n.id}')" ${!isWindow()?'disabled':''}>他クラブからのオファーを募集</button><button class="danger" onclick="releaseDeparturePlayer('${n.id}')">フリーで退団</button><button class="primary" onclick="respondDeparture('${n.id}','stay')">残留を説得</button></div>${!isWindow()?'<div class="small muted">他クラブからのオファー募集は移籍市場の開場中（7〜8月・1月）に行えます。</div>':''}`}}
else if(n.type==='contract_expiry'){body=`<div><b>${name}</b> の契約期間が残り${p?`${p.contract}年`:'—'}となりました。</div><div class="small">契約延長の条件を提示して交渉するか、選手を放出できます。交渉中は選手はチームに残ります。</div>`;if(n.status==='pending'){actions=`<div class="actions"><button class="primary" onclick="openContractNegotiation('${n.id}')">契約延長を交渉</button><button class="gold" onclick="releaseContractPlayer('${n.id}')" ${S.players.length<=14?'disabled':''}>放出</button></div>${S.players.length<=14?'<div class="small muted">登録選手を14人未満にできないため、放出するには先に補強してください。</div>':''}`}}
else if(n.type==='retirement'){body=`<div><b>${name}</b> が現役引退の意向を表明しました。</div><div class="small">${n.retirementSeason}シーズン終了後に引退する予定です。今シーズンは引き続きチームに所属します。</div>`;if(n.status==='scheduled'&&!n.acknowledged)actions=`<div class="actions"><button onclick="acknowledgeInbox('${n.id}')">確認</button></div>`}
else if(n.type==='secret_hint'){body=`<div style="font-weight:800;color:var(--gold);margin-bottom:6px">${n.title||'秘密のヒント'}</div><div>${n.message||''}</div>`}else{body=`<div>${n.message||''}</div>`}
return `<article class="notice" style="border-left-color:${n.type==='club_offer'?'var(--gold)':n.type==='retirement'?'var(--red)':n.type==='contract_expiry'?'var(--gold)':n.type==='secret_hint'?'var(--gold)':'var(--blue)'}"><div class="between"><b>${n.type==='club_offer'?'📩 他クラブからのオファー':n.type==='retirement'?'🕊️ 引退表明':n.type==='contract_expiry'?'📝 契約更新通知':n.type==='secret_hint'?'🔐 秘密のヒント':'🔁 退団希望'}</b><span class="tag ${n.status==='pending'?'bad':n.status==='scheduled'?'':'good'}">${status}</span></div><div class="small muted">${n.createdAt||''}</div>${body}${n.result?`<div class="small green">${displayClubText(n.result)}</div>`:''}${actions}</article>`}).join(''):'<div class="notice">まだクラブ通知はありません。移籍市場での交渉やシーズン経過に応じて、ここに通知が届きます。</div>'}</section>`}
function acknowledgeInbox(id){let n=S.inbox?.find(x=>x.id===id);if(!n)return;n.acknowledged=true;save();render()}
function transferOutFromInbox(n,fee){let p=S.players.find(x=>x.id===n.playerId);if(!p){n.status='withdrawn';n.result='対象選手がチームにいないため、オファーは終了しました。';save();render();return false}if(S.players.length<=14){toast('最低14人の登録選手が必要です。先に補強してください。');return false}fee=Math.round(Number(fee)*10)/10;if(!Number.isFinite(fee)||fee<=0){toast('移籍金が正しくありません。');return false}S.budget+=fee;financeRecord('income',fee,'他クラブへの選手売却収入');S.players=S.players.filter(x=>x.id!==p.id);refreshStartingLineup();S.transfers??=[];S.transfers.push(`${p.name}を${displayClubName(n.club)||'他クラブ'}へ${money(fee)}で売却`);n.status='accepted';n.result=`${p.name}の移籍が成立。移籍金 ${money(fee)} を受け取りました。`;closeOtherPlayerNotices(p.id,n.id,'withdrawn','選手が移籍したため、この通知は終了しました。');S.news.unshift(`${p.name}が${displayClubName(n.club)||'他クラブ'}へ移籍。移籍金 ${money(fee)}。`);S.news=S.news.slice(0,12);save();render();toast(`${p.name}の移籍が成立しました。`);return true}
function respondIncomingOffer(id,action){let n=S.inbox?.find(x=>x.id===id&&x.type==='club_offer');if(!n||n.status!=='pending')return;if(action==='reject'){n.status='rejected';n.result=`${displayClubName(n.club)}からのオファーを拒否しました。`;S.news.unshift(`${n.playerName}への${displayClubName(n.club)}からのオファーを拒否。`);save();render();toast('オファーを拒否しました');return}if(action==='accept'){if(!confirm(`${n.playerName}を${displayClubName(n.club)}へ ${money(n.fee)} で売却しますか？`))return;transferOutFromInbox(n,n.fee);return}if(action==='negotiate'){let suggested=Math.round(n.fee*1.15*10)/10;showModal(`<h2>条件交渉</h2><p>${displayClubName(n.club)} からの ${n.playerName} へのオファーです。</p><p>先方の提示額：<b class="goldtxt">${money(n.fee)}</b></p><div class="field"><label>希望移籍金 (€M)</label><input id="counterFee" type="number" min="${n.fee}" step="0.1" value="${suggested.toFixed(1)}"></div><div class="notice">希望額が高いほど、相手クラブが交渉を拒否する可能性が高くなります。</div><div class="actions"><button class="primary" onclick="submitIncomingCounterOffer('${n.id}')">カウンターを送る</button><button onclick="closeModal()">戻る</button></div>`)}}
function submitIncomingCounterOffer(id){let n=S.inbox?.find(x=>x.id===id&&x.type==='club_offer');if(!n||n.status!=='pending'){closeModal();return}let fee=Number($('#counterFee')?.value);if(!Number.isFinite(fee)||fee<n.fee){toast('希望額は先方の提示額以上にしてください。');return}let ratio=fee/n.fee,probability=ratio<=1.05 ? .9 : ratio<=1.15 ? .75 : ratio<=1.3 ? .5 : ratio<=1.5 ? .25 : .08;closeModal();if(Math.random()<probability){n.fee=Math.round(fee*10)/10;transferOutFromInbox(n,n.fee)}else{n.status='rejected';n.result=`${n.club}は希望額 ${money(fee)} に合意せず、交渉は決裂しました。`;S.news.unshift(`${n.playerName}の${n.club}との移籍金交渉が決裂。`);S.news=S.news.slice(0,12);save();render();toast('相手クラブがカウンターオファーを拒否しました。')}}
function respondDeparture(id,action){let n=S.inbox?.find(x=>x.id===id&&x.type==='departure');if(!n||n.status!=='pending')return;let p=S.players.find(x=>x.id===n.playerId);if(!p){n.status='withdrawn';n.result='対象選手がチームにいないため、通知を終了しました。';save();render();return}if(action==='stay'){p.morale=clamp((p.morale||60)+15,0,100);p.transferRequestPending=false;n.status='persuaded';n.result=`${p.name}を説得し、残留することになりました。モラルが回復しました。`;S.news.unshift(`${p.name}を説得し、残留が決定。`);S.news=S.news.slice(0,12);save();render();toast(`${p.name}は残留することになりました。`);return}if(action==='sell'){if(!isWindow()){toast('移籍交渉は移籍市場の開場中（7〜8月・1月）に行えます。');return}sellPlayer(p.id,n.id)}}
function openContractNegotiation(id){let n=S.inbox?.find(x=>x.id===id&&x.type==='contract_expiry'&&x.status==='pending');if(!n)return;let p=S.players.find(x=>x.id===n.playerId);if(!p){n.status='withdrawn';n.result='対象選手がチームにいないため、契約通知を終了しました。';save();render();return}let current=Math.max(.01,Number(p.wage)||.01),demand=Math.round(Math.max(current,p.ovr*p.ovr*.00003)*1.15*100)/100;showModal(`<h2>${p.name} 契約延長交渉</h2><p>${p.pos} · OVR ${p.ovr} · 年齢 ${p.age}歳 · 現在の契約残り ${p.contract}年</p><p>現在の週給：<b>${money(current)}</b> · 選手側の希望目安：<b class="goldtxt">${money(demand)}</b></p><div class="field"><label>延長する契約年数</label><select id="renewYears"><option value="1">1年</option><option value="2">2年</option><option value="3" selected>3年</option><option value="4">4年</option><option value="5">5年</option></select></div><div class="field"><label>提示する週給 (€M)</label><input id="renewWage" type="number" min="0.01" step="0.01" value="${demand.toFixed(2)}"></div><div class="notice">希望額以上なら成立しやすくなります。条件が合わなければ再交渉できます。</div><div class="actions"><button class="primary" onclick="submitContractRenewal('${n.id}')">契約条件を提示</button><button onclick="closeModal()">戻る</button></div>`)}
function submitContractRenewal(id){let n=S.inbox?.find(x=>x.id===id&&x.type==='contract_expiry'&&x.status==='pending');if(!n){closeModal();return}let p=S.players.find(x=>x.id===n.playerId);if(!p){n.status='withdrawn';n.result='対象選手がチームにいないため、交渉を終了しました。';closeModal();save();render();return}let years=Number($('#renewYears')?.value),wage=Number($('#renewWage')?.value);if(!Number.isInteger(years)||years<1||years>5||!Number.isFinite(wage)||wage<=0){toast('契約年数と週給を正しく入力してください。');return}let current=Math.max(.01,Number(p.wage)||.01),demand=Math.max(current,p.ovr*p.ovr*.00003)*1.15,ratio=wage/demand;let probability=ratio>=1.15?.96:ratio>=1?.82:ratio>=.9?.58:ratio>=.8?.3:.1;probability+=.10+((Number(p.morale)||60)-60)*.002;if(p.age>=35)probability-=.12;else if(p.age>=32)probability-=.06;probability=clamp(probability,.05,.98);closeModal();if(Math.random()<probability){p.contract=years;p.wage=Math.round(wage*100)/100;p.contractReviewPending=false;n.status='renewed';n.result=`${p.name}と契約を${years}年延長。新しい週給は${money(p.wage)}です。`;S.news.unshift(`${p.name}との契約を${years}年延長した。`);S.news=S.news.slice(0,12);save();render();toast(`${p.name}との契約延長が成立しました。`)}else{n.result=`${p.name}は提示条件に合意しませんでした（成立確率の目安 ${Math.round(probability*100)}%）。条件を見直して再交渉できます。`;save();render();toast(`${p.name}との契約交渉はまとまりませんでした。`)}}
function releaseContractPlayer(id){let n=S.inbox?.find(x=>x.id===id&&x.type==='contract_expiry'&&x.status==='pending');if(!n)return;let p=S.players.find(x=>x.id===n.playerId);if(!p){n.status='withdrawn';n.result='対象選手がチームにいないため、契約通知を終了しました。';save();render();return}if(S.players.length<=14){toast('最低14人の登録選手が必要です。先に補強してください。');return}if(!confirm(`${p.name}を契約満了に伴い放出しますか？移籍金は発生しません。`))return;S.players=S.players.filter(x=>x.id!==p.id);refreshStartingLineup();n.status='released';n.result=`${p.name}を契約満了に伴い放出しました。`;closeOtherPlayerNotices(p.id,n.id,'withdrawn','選手を放出したため、この通知は終了しました。');S.transfers??=[];S.transfers.push(`${p.name}を契約満了に伴い放出（移籍金なし）`);S.news.unshift(`${p.name}を契約満了に伴い放出した。`);S.news=S.news.slice(0,12);save();render();toast(`${p.name}を放出しました。`)}
function scheduleContractReviewNotices(){for(const p of S.players){if(p.contract>1||p.retirementSeason)continue;let active=(S.inbox||[]).some(n=>n.type==='contract_expiry'&&n.playerId===p.id&&n.status==='pending');if(active)continue;p.contractReviewPending=true;addInbox({type:'contract_expiry',playerId:p.id,playerName:p.name,contractRemaining:p.contract,status:'pending'},`${p.name}の契約期間が残り${p.contract}年となった。契約延長か放出を検討しよう。`)}}
function maybeGenerateClubOffer(){if(!isWindow())return;let active=(S.inbox||[]).filter(n=>n.type==='club_offer'&&n.status==='pending');if(active.length>=2||Math.random()>.15)return;let used=new Set((S.inbox||[]).filter(n=>n.type==='club_offer'&&n.season===S.season).map(n=>n.playerId));let candidates=S.players.filter(p=>!used.has(p.id)&&!p.retirementSeason&&!p.transferRequestPending&&p.contract>0);if(!candidates.length)return;let p=candidates[Math.floor(Math.random()*candidates.length)];let clubs=[...EPL,...EXTRA].filter(c=>c!==S.club);let club=clubs[Math.floor(Math.random()*clubs.length)];let baseFee=Math.round(p.value*(.85+Math.random()*.55)*10)/10,contractPenalty=contractPenaltyFor(p),fee=Math.round((baseFee+contractPenalty)*10)/10;let n=addInbox({type:'club_offer',playerId:p.id,playerName:p.name,club,fee,baseFee,contractPenalty,contractYearsAtOffer:p.contract,value:p.value,status:'pending'},`${club}から${p.name}への移籍オファーが届いた。基本額 ${money(baseFee)}＋契約残存違約金 ${money(contractPenalty)}、合計 ${money(fee)}。`);return n}
function maybeGenerateDepartureRequest(){if((S.week||1)<6||Math.random()>.1)return;let active=new Set((S.inbox||[]).filter(n=>n.type==='departure'&&n.status==='pending').map(n=>n.playerId));let candidates=S.players.filter(p=>!active.has(p.id)&&!p.transferRequestPending&&!p.retirementSeason&&p.age<35&&(p.morale<=45||p.apps<Math.max(2,Math.floor(((S.week||1)-1)*.25))));if(!candidates.length)return;let p=candidates[Math.floor(Math.random()*candidates.length)];p.transferRequestPending=true;let reason=p.morale<=45?'クラブでの状況や役割に不満がある':'出場機会が少ないことに不満がある';addInbox({type:'departure',playerId:p.id,playerName:p.name,reason,status:'pending'},`${p.name}が退団を希望している。理由：${reason}。`)}
function processClubEvents(){maybeGenerateClubOffer();maybeGenerateDepartureRequest();save()}
function scheduleRetirementNotices(){for(const p of S.players){if(p.age<35||p.retirementSeason)continue;let chance=p.age>=39 ? .72 : p.age>=37 ? .48 : p.age>=35 ? .22 : .08;if(Math.random()<chance){p.retirementSeason=S.season;addInbox({type:'retirement',playerId:p.id,playerName:p.name,retirementSeason:S.season,status:'scheduled',acknowledged:false},`${p.name}が今シーズン終了後の現役引退を表明。`);}}}
function processRetirementsAtSeasonEnd(){let retiring=S.players.filter(p=>p.retirementSeason&&p.retirementSeason<=S.season);if(!retiring.length)return;let ids=new Set(retiring.map(p=>p.id));for(const p of retiring){let n=(S.inbox||[]).find(x=>x.type==='retirement'&&x.playerId===p.id&&x.status==='scheduled');closeOtherPlayerNotices(p.id,n?.id||null,'withdrawn','選手が現役を引退したため、この通知は終了しました。');if(n){n.status='completed';n.result=`${p.name}が現役を引退しました。`;}}S.players=S.players.filter(p=>!ids.has(p.id));S.starting=(S.starting||[]).filter(id=>!ids.has(id));refreshStartingLineup();for(const p of retiring)S.news.unshift(`${p.name}が現役を引退しました。`);S.news=S.news.slice(0,12)}
function home(){let next=S.fixtures.find(f=>!f.played);let avg=Math.round(S.players.reduce((a,p)=>a+p.ovr,0)/S.players.length);let injured=S.players.filter(p=>p.injury>0).length;let low=S.players.filter(p=>p.stamina<45).length;let starterCount=(S.starting||[]).filter(id=>S.players.some(p=>p.id===id&&!p.injury)).length;return `<section class="panel"><div class="between"><div><div class="sub">MANAGER DASHBOARD</div><h2>${displayClubName(S.club)} <span class="tag">${S.tier}部</span></h2><div class="muted">${S.season}/${S.season+1} シーズン · ${monthName(S.month)}${S.day||1}日 · 第${S.week}節</div></div><div class="actions"><button class="primary" onclick="playNext()">▶ 次の試合を進める</button></div></div><div class="grid"><div class="stat"><small>クラブ資金</small><b>${money(S.budget)}</b></div><div class="stat"><small>平均総合値</small><b>${avg}</b></div><div class="stat"><small>負傷者</small><b class="${injured?'red':'green'}">${injured}人</b></div><div class="stat"><small>低体力（45以下）</small><b>${low}人</b></div></div></section><section class="panel"><div class="between"><h2>次の試合</h2><div class="next-match-tools"><button class="gold" onclick="autoSquad('best')">⭐ ${LANG==='en'?'Set Recommended XI':'おすすめスカッドに変更'}</button><button onclick="autoSquad('rotation')">🔄 ${LANG==='en'?'Rotation':'ローテーション'}</button><button class="primary" onclick="playNext()">▶ ${LANG==='en'?'Play Next Match':'次の試合を進める'}</button></div></div>${next?`<div class="fixture"><div><b>${displayClubName(next.home?S.club:next.opp)}</b><div class="small">${next.home?'ホーム':'アウェイ'} · プレミアリーグ</div></div><b>VS</b><div><b>${displayClubName(next.home?next.opp:S.club)}</b><div class="small">第${next.week}節</div></div></div>`:`<div class="notice">今季のリーグ戦日程は終了。シーズン更新から次のシーズンへ進めるよ。</div>`}<div class="notice">${LANG==='en'?'Current starting XI: ':'現在のスタメン：'}<b>${starterCount}/11</b>${LANG==='en'?' players selected':'人選択済み'}${starterCount<11?(LANG==='en'?' · Press Recommended XI to select the best available players.':' · おすすめスカッドを押すと、出場可能選手からベストメンバーを自動選出するよ。'):''}</div></section><section class="panel"><div class="between"><h2>クラブ通知</h2><button onclick="tab='inbox';render()">通知ページを開く（${inboxPendingCount()}件未対応）</button></div>${inboxPendingCount()?`<div class="notice">未確認・未対応の通知があります。移籍オファーや選手の退団希望を確認してください。</div>`:'<div class="small muted">未対応の通知はありません。</div>'}</section><section class="panel"><h2>クラブニュース</h2>${S.news.slice(0,7).map(n=>`<div class="notice">${displayClubText(n)}</div>`).join('')}</section>`}
const SPECIAL_FLAGS={'France':'🇫🇷','Spain':'🇪🇸','England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Italy':'🇮🇹','Netherlands':'🇳🇱','Germany':'🇩🇪','Portugal':'🇵🇹','Croatia':'🇭🇷','Sweden':'🇸🇪','Egypt':'🇪🇬','Cameroon':'🇨🇲','Senegal':'🇸🇳','Argentina':'🇦🇷','Uruguay':'🇺🇾','Brazil':'🇧🇷','Japan':'🇯🇵'};

function squad(){let sorted=[...S.players].sort((a,b)=>b.ovr-a.ovr),vacationCost=teamVacationCost();return `<section class="panel"><div class="between"><h2>トップチーム · ${S.players.length}人</h2><div class="actions"><button onclick="autoSquad('best')">最適編成</button><button onclick="autoSquad('fit')">コンディション優先</button><button onclick="autoSquad('rotation')">ローテーション</button></div></div>${formationDiagram()}${S.players.some(p=>p.emergency)?`<div class="notice" style="border-left-color:var(--gold)"><b>⚠️ 緊急補充選手が在籍中</b><p>負傷者などにより適正ポジションで11人を組めないため、無料の架空選手（OVR80固定）を一時追加しています。実在選手だけで11人を編成できるようになると自動で削除されます。</p></div>`:''}<div class="notice"><b>🏖️ チームバカンス</b><p>全選手を一括で休養させる制度。体力と調子をまとめて回復できます。負傷そのものは治りません。</p><div class="actions"><button class="gold" onclick="teamVacation()">🏖️ 全員でバカンス（${money(vacationCost)}）</button></div></div>${playerRows(sorted)}</section>`}

function legendValue(ovr){return Math.round(Math.max(8,(ovr-60)*(ovr-60)*.12)*10)/10}
function legendWindowKey(){if(!isWindow())return null;return `${S.season}-${S.month===1?'winter':'summer'}`}
function ensureLegendMarketSelection(){
 const key=legendWindowKey();if(!key)return [];
 S.legendMarketWindows??={};S.legendSigned??=[];
 if(!Array.isArray(S.legendMarketWindows[key])){
  let pool=LEGENDS.filter(d=>!S.players.some(p=>p.name===d[0])&&!S.legendSigned.includes(d[0]));
  for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  S.legendMarketWindows[key]=pool.slice(0,6).map(d=>`${d[0]}::${d[2]}`);
  save();
 }
 return S.legendMarketWindows[key].map(k=>{let [name,year]=k.split('::');return LEGENDS.find(d=>d[0]===name&&String(d[2])===year)}).filter(Boolean).filter(d=>!S.players.some(p=>p.name===d[0])&&!S.legendSigned.includes(d[0]));
}

 let japan=JAPAN_PLAYERS.filter(x=>!specialNames.has(x[0])).map(x=>({club:'Japan National Team',actualClub:x[5],name:x[0],pos:x[1],ovr:x[2],age:x[3],value:x[4],key:'Japan::'+x[0],source:'japan'}));
 let legends=ensureLegendMarketSelection().map(d=>({club:'レジェンド市場',name:d[0],pos:d[1],peakYear:d[2],peakAge:d[2]-d[3],age:d[2]-d[3],ovr:d[4],nationality:d[5],positions:d[6],value:legendValue(d[4]),key:`Legend::${d[0]}::${d[2]}`,source:'legend'}));
 let specials=S.specialMarketUnlocked?SPECIAL_CARDS.map(d=>({club:'SPECIAL CARD',name:d[0],pos:d[1],ovr:d[2],age:d[3],value:d[4],nationality:d[5],positions:d[6],key:`Special::${d[0]}::${d[5]}`,source:'special'})):[];
 return [...regular,...japan,...legends,...specials].filter(p=>!signed.has(p.key)&&(p.source==='special'?!S.players.some(x=>x.specialCardId===p.key):!S.players.some(x=>x.name===p.name))).sort((a,b)=>b.ovr-a.ovr||a.name.localeCompare(b.name));

function updateTicketPrice(){
 // getElementByIdで入力欄を直接取得（$関数はCSSセレクター指定なので '#ticket' が必要）
 const input=document.getElementById('ticket');
 if(!input){toast('チケット価格の入力欄を取得できませんでした。財務画面を開き直してね');return}
 if(input.value.trim()===''){toast('有効な金額を入力してね');return}
 const raw=Number(input.value);
 if(!Number.isFinite(raw)){toast('有効な金額を入力してね');return}
 // このセーブデータ固有のランダム価格で管理者コードを表示
 if(Math.abs(raw-Number(S.secretTicketPrice))<0.000001){
  showModal(`<div style="text-align:center;padding:10px 0"><div style="font-size:42px">🎟️</div><div class="sub">SECRET TICKET EVENT</div><h2 class="goldtxt">幻のチケット価格を発見！</h2><p>「${Number(S.secretTicketPrice).toFixed(1)}m€……この価格を知る者に、管理者の鍵を授けよう。」</p><div class="notice" style="text-align:center"><div class="small">管理者コード</div><div style="font-size:22px;font-weight:900;letter-spacing:1px;color:#f6c85f;margin:8px 0">${S.secretAdminCode}</div><button onclick="navigator.clipboard?.writeText('${S.secretAdminCode}');toast('管理者コードをコピーしました')">コードをコピー</button></div><p class="muted">この入力は秘密イベントとして扱われ、実際のチケット価格は変更されません。</p><div class="actions"><button class="primary" onclick="closeModal();showSecretCodePanel()">秘密コード入力欄を開く</button><button onclick="closeModal()">閉じる</button></div></div>`);
  return;
 }
 const next=Math.round(Math.max(10,Math.min(100,raw)));
 ensureFanEconomy();const oldTicket=Number(S.ticket)||38,priceDelta=next-oldTicket;if(priceDelta>0)fanMoodChange(-Math.min(12,priceDelta*.22),'チケット価格の値上げ');else if(priceDelta<0)fanMoodChange(Math.min(5,Math.abs(priceDelta)*.12),'チケット価格の値下げ');
 S.ticket=next;
 save();
 render();
 toast(`チケット価格を€${next}に更新したよ`);
}

function ensureFanEconomy(){if(!S)return;if(!Number.isFinite(S.fanSatisfaction))S.fanSatisfaction=72;if(!Number.isFinite(S.fanLastAttendance))S.fanLastAttendance=0;if(!S.fanSubscription||typeof S.fanSubscription!=='object')S.fanSubscription={members:0,monthlyPrice:5};if(!Number.isFinite(S.fanSubscription.members))S.fanSubscription.members=0;if(!Number.isFinite(S.fanSubscription.monthlyPrice)||S.fanSubscription.monthlyPrice<=0)S.fanSubscription.monthlyPrice=5;if(!Number.isFinite(S.stadiumLevel))S.stadiumLevel=0}
function fanMoodChange(delta,reason){ensureFanEconomy();let before=S.fanSatisfaction;S.fanSatisfaction=clamp(before+delta,0,100);let actual=Math.round((S.fanSatisfaction-before)*10)/10;if(actual!==0)S.news.unshift(`サポーター満足度 ${actual>0?'+':''}${actual.toFixed(1)}：${reason}（現在 ${S.fanSatisfaction.toFixed(0)}/100）`);S.news=S.news.slice(0,12)}
function isDerbyMatch(opponent){const pairs=[['Arsenal','Tottenham'],['Arsenal','Chelsea'],['Chelsea','Tottenham'],['Chelsea','Fulham'],['Liverpool','Everton'],['Manchester City','Manchester United'],['Newcastle United','Sunderland'],['Aston Villa','Birmingham City'],['Real Madrid','Atletico Madrid'],['Barcelona','Espanyol'],['Inter','AC Milan'],['Roma','Lazio'],['Bayern Munich','Borussia Dortmund']];return pairs.some(([a,b])=>(S.club===a&&opponent===b)||(S.club===b&&opponent===a))}
function estimateFanAttendance(opponent){ensureFanEconomy();const capacity=Math.max(10000,Number(S.stadium)||30000),repFactor=clamp(.72+(Number(S.rep)||50)/250,.78,1.12),priceFactor=clamp(1.18-(Number(S.ticket||38)-30)*.008,.48,1.25),moodFactor=.45+(S.fanSatisfaction/100)*.55,derby=isDerbyMatch(opponent)?1.06:1;return Math.round(Math.min(capacity,capacity*.86*repFactor*priceFactor*moodFactor*derby))}
function upgradeStadium(){ensureFanEconomy();const level=S.stadiumLevel||0,cost=Math.round((12+level*8)*10)/10,added=5000;if(S.stadium>=100000){toast('スタジアムは最大収容人数に達しています');return}if(S.budget<cost){toast(`拡張費用 ${money(cost)} が不足しています`);return}if(!confirm(`スタジアムを5,000席拡張する？\n費用：${money(cost)}\n拡張後：${Math.min(100000,S.stadium+added).toLocaleString()}席`))return;S.budget-=cost;S.stadium=Math.min(100000,S.stadium+added);S.stadiumLevel=level+1;financeRecord('expenses',cost,'スタジアム拡張工事');S.news.unshift(`スタジアム拡張完了！収容人数が${S.stadium.toLocaleString()}人になった。`);save();render();toast('スタジアムを拡張したよ！')}
function updateFanSubscriptionPrice(){
 ensureFanEconomy();
 const el=document.querySelector('#fanSubPrice');
 if(!el){toast('価格入力欄が見つかりません');return}
 const raw=Number(el.value);
 if(!Number.isFinite(raw)){toast('有効な価格を入力してね');return}
 const next=Math.max(1,Math.min(50,Math.round(raw)));
 const old=Number(S.fanSubscription.monthlyPrice)||5;
 const diff=next-old;
 if(diff>0)fanMoodChange(-Math.min(10,diff*.45),'サブスクリプション価格の値上げ');
 else if(diff<0)fanMoodChange(Math.min(6,Math.abs(diff)*.3),'サブスクリプション価格の値下げ');
 S.fanSubscription.monthlyPrice=next;
 S.fanSubscription.lastPriceChange=diff;
 save();render();
 toast(`クラブサブスクを月額€${next}に設定したよ`);
}

gin:18px 0"><h3>月次決算・掲示板</h3>${rows||'<p class="muted">最初の月次決算は月末に発表されます。</p>'}<hr style="border-color:var(--line);margin:18px 0"><div class="notice" style="border:1px solid var(--line);padding:12px;margin:10px 0">

function financeMonthKey(){return `${calendarYear()}-${String(S.month||8).padStart(2,'0')}`}

 negotiation.locked=true;negotiation.accepted=true;S.budget-=offer;financeRecord('expenses',offer,'選手獲得移籍金');S.players.push(player);refreshStartingLineup();

// V10.6: GitHub Pages version check + user-confirmed update.
(function(){
  'use strict';
  const LOCAL_VERSION = '10.6';
  const banner = document.getElementById('updateBanner');
  const title = document.getElementById('updateTitle');
  const notes = document.getElementById('updateNotes');
  const updateButton = document.getElementById('updateNow');
  const laterButton = document.getElementById('updateLater');
  if (!banner || !updateButton || !laterButton) return;
  let remoteVersion = '';
  let updateInProgress = false;
  function parts(v){ return String(v || '0').replace(/^v/i,'').split('.').map(x => parseInt(x,10) || 0); }
  function isNewer(a,b){ const x=parts(a), y=parts(b); for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d!==0)return d>0;}return false; }
  function dismissed(v){ try{return sessionStorage.getItem('fcm_update_dismissed')===v;}catch(e){return false;} }
  function show(v, releaseNotes){
    remoteVersion=String(v);
    if (!isNewer(remoteVersion,LOCAL_VERSION) || dismissed(remoteVersion)) return;
    title.textContent='新しいバージョン V'+remoteVersion+' が利用できます';
    notes.textContent=releaseNotes || '最新版に更新できます。現在のセーブデータはそのまま保持されます。';
    banner.classList.add('show');
  }
  async function check(){
    try{
      const u=new URL('./version.json',window.location.href);
      u.searchParams.set('_',String(Date.now()));
      const r=await fetch(u.toString(),{cache:'no-store',credentials:'same-origin'});
      if(!r.ok) return;
      const data=await r.json();
      if(data && data.version) show(data.version,data.releaseNotes || data.release_notes || '');
    }catch(e){ /* Offline or version.json not deployed yet: keep the game playable. */ }
  }
  laterButton.addEventListener('click',function(){
    try{sessionStorage.setItem('fcm_update_dismissed',remoteVersion);}catch(e){}
    banner.classList.remove('show');
  });
  updateButton.addEventListener('click',async function(){
    if(updateInProgress || !remoteVersion) return;
    updateInProgress=true; updateButton.disabled=true; updateButton.textContent='更新を読み込み中…';
    try{
      const u=new URL('./index.html',window.location.href);
      u.searchParams.set('update',remoteVersion);
      u.searchParams.set('_',String(Date.now()));
      const r=await fetch(u.toString(),{cache:'no-store',credentials:'same-origin'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const html=await r.text();
      if(!/<html[\s>]/i.test(html) || !/FOOTBALL CLUB/i.test(html)) throw new Error('更新ファイルを確認できません');
      // document.write reloads the fetched latest page while preserving localStorage saves.
      document.open(); document.write(html); document.close();
    }catch(e){
      updateButton.disabled=false; updateButton.textContent='再試行する'; updateInProgress=false;
      alert('アップデートに失敗しました。通信状況とGitHub Pagesへのファイル公開を確認してください。\n'+e.message);
    }
  });
  check();
  setInterval(check,5*60*1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden) check();});
})();
</script></body></html>
